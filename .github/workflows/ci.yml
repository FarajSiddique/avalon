name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Pull requests cancel stale runs. Pushes to main never cancel each other.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Wrangler and the Cloudflare tooling must not phone home from CI.
  WRANGLER_SEND_METRICS: "false"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: The committed route tree matches the routes
        run: git diff --exit-code src/routeTree.gen.ts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:restart
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://avalon.hong-ladder.workers.dev
    # A second merge waits for the running deploy instead of cancelling it.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://avalon.hong-ladder.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy
        run: pnpm run deploy
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests against the live site
        run: pnpm test:e2e
        env:
          E2E_BASE_URL: ${{ env.PRODUCTION_URL }}
      - name: CPU check against the live site
        run: node scripts/cpu-check.mjs --url "$PRODUCTION_URL" --worker avalon --paths /,/room/ZZZZ
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-test-results
          path: test-results/
          retention-days: 7
